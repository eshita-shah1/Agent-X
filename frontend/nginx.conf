# Agent-X web server and reverse proxy (Phase 8). Runs as an unprivileged user on port 8080 inside the container.
# In production put a TLS-terminating proxy or load balancer in front (docs/DEPLOYMENT.md); it should set
# X-Forwarded-Proto/For, and the API trusts those only from TRUSTED_PROXY_IPS.

# Abuse limits per client address (in-memory in nginx, not in the application).
limit_req_zone $binary_remote_addr zone=agentx_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=agentx_api:10m rate=20r/s;
limit_req_status 429;

upstream agentx_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    client_max_body_size 1m;          # the API also refuses bodies over MAX_REQUEST_BODY_BYTES
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers are set per location: the API sets its own (stricter) headers on /api and /health, and nginx
    # adds the UI's below, so no response carries duplicates.

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location = /api/v1/auth/login {
        limit_req zone=agentx_login burst=5 nodelay;
        proxy_pass http://agentx_api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /api/ {
        limit_req zone=agentx_api burst=40 nodelay;
        proxy_pass http://agentx_api;
        # explanation generation may call an LLM: bounded by LLM_TIMEOUT_SECONDS x (LLM_MAX_RETRIES + 1)
        proxy_read_timeout 300s;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location /health {
        proxy_pass http://agentx_api;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Hashed build assets never change: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: every other path serves index.html (never cached, so new releases load immediately).
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
