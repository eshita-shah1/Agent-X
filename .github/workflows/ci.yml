# Agent-X CI (Phase 8). Runs on pull requests and pushes to main. It only ever talks to a throwaway PostgreSQL service
# container created for the job (databases agentx_ci and agentx_ci_test, a non-superuser role); it never sees a real
# development, staging or production database, and execution stays disabled (the tests enable simulation in-process
# with synthetic fixtures only). Secrets are generated per run and never printed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, migrations and tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-superuser-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: PostgreSQL 18 client tools (pg_dump/pg_restore for the backup tests)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Create a least-privilege role and the CI databases
        env:
          PGUSER: postgres
          PGPASSWORD: ci-superuser-only
        run: |
          APP_PW="$(openssl rand -hex 24)"
          echo "::add-mask::$APP_PW"
          echo "APP_PW=$APP_PW" >> "$GITHUB_ENV"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE agentx_app LOGIN PASSWORD '$APP_PW' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE agentx_ci OWNER agentx_app"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE agentx_ci_test OWNER agentx_app"
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE agentx_restore_check OWNER agentx_app"
      - name: Write the CI-only .env (generated values)
        run: |
          JWT="$(openssl rand -hex 32)"
          echo "::add-mask::$JWT"
          cat > .env <<EOF
          ENVIRONMENT=test
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_USER=agentx_app
          DB_PASSWORD=$APP_PW
          DB_NAME=agentx_ci
          DB_TEST_NAME=agentx_ci_test
          JWT_SECRET_KEY=$JWT
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          EXECUTION_MODE=disabled
          EOF
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Lint (ruff, correctness rules)
        working-directory: backend
        run: ruff check .
      - name: Migrations apply cleanly to an empty database and match the models
        working-directory: backend
        run: |
          python -m alembic -x db=test upgrade head
          python -m alembic -x db=test check
          test "$(python -m alembic -x db=test heads | grep -c head)" = "1"
      - name: Test suite (includes the 0001 -> head -> base -> head round trip and isolation checks)
        working-directory: backend
        run: python -m pytest -q -W default --durations=15

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check (lint)
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Bundle must not contain backend secrets or env files
        run: |
          ! grep -RIl -E "JWT_SECRET_KEY|DB_PASSWORD|LLM_API_KEY|BEGIN [A-Z ]*PRIVATE KEY" dist/

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Python dependencies (pip-audit; fails on any known vulnerability)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (fails on critical; known high/moderate findings are assessed in docs/SECURITY.md)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=critical
      - name: No env files or private keys are tracked
        run: |
          ! git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'
          ! git grep -I -E "BEGIN [A-Z ]*PRIVATE KEY"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image (not pushed)
        run: docker build -t agentx-backend:ci backend
      - name: Build the web image (not pushed)
        run: docker build -t agentx-web:ci frontend
      - name: The API image runs as a non-root user and has no .env baked in
        run: |
          test "$(docker run --rm --entrypoint id agentx-backend:ci -u)" = "10001"
          ! docker run --rm --entrypoint sh agentx-backend:ci -c 'ls -a /app' | grep -q '^\.env'
      - name: Compose files are valid
        # Validated as it is used: with an env file (placeholders here; real values never live in the repo).
        run: |
          printf 'DB_NAME=agentx_ci\nDB_USER=agentx_ci\nDB_PASSWORD=placeholder-not-a-secret\n' > .env.production
          docker compose -f docker-compose.prod.yml --env-file .env.production config -q
          docker compose -f docker-compose.prod.yml --env-file .env.production --profile tools --profile bundled-db config -q
