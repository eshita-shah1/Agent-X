[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

# Phase 8: CI lint gate. Correctness rules only (syntax errors, undefined names, invalid comparisons/statements), so
# the gate catches real bugs without restyling five phases of reviewed code. Wider rules can be adopted file by file.
[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
